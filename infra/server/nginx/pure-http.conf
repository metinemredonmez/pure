# http bağlamı (conf.d) — 40-nginx.sh buraya kopyalar.

# Kimlik doğrulama uçlarına IP başına hız sınırı (backend'in kendi kilitlemesine ek katman)
limit_req_zone $binary_remote_addr zone=pure_auth:10m rate=20r/m;
limit_req_status 429;

# Upgrade başlığı yoksa bağlantıyı upstream keepalive için açık tut
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server_tokens off;

# Ubuntu'nun nginx.conf'unda `gzip on` zaten açık; yalnızca türleri genişletiyoruz
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/json application/javascript text/css image/svg+xml text/plain;
