# Uygulamaya yönlendirirken ortak başlıklar.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header X-Real-IP $remote_addr;
# Backend (rate limit, kilitleme, ödeme IP'si) X-Forwarded-For'un İLK değerini istemci IP'si sayıyor.
# İstemcinin kendi gönderdiği başlığa güvenilmez: EKLEMİYORUZ, üzerine yazıyoruz.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 60s;
